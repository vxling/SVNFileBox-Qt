name: Qt Cross-Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.7.2 via aqtinstall
        run: |
          pip install aqtinstall>=3.2
          mkdir -p ~/Qt
          aqt install-qt linux desktop 6.7.2 linux_gcc_64 -O ~/Qt

      - name: Install system dependencies
        run: |
          sudo apt-get install -y libgl1-mesa-dev

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$HOME/Qt/6.7.2/gcc_64/lib/cmake
          cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix release
          tar -C release -czvf svnfilebox-linux.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-linux
          path: svnfilebox-linux.tar.gz
          retention-days: 5

  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.7.2
        run: |
          pip install aqtinstall>=3.2
          mkdir -p ~/Qt
          aqt install-qt mac desktop 6.7.2 clang_64 -O ~/Qt

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$HOME/Qt/6.7.2/6.7.2/macos/lib/cmake
          cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix release
          tar -C release -czvf svnfilebox-macos.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-macos
          path: svnfilebox-macos.tar.gz
          retention-days: 5

  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.7.2
        run: |
          pip install aqtinstall>=3.2
          mkdir -p C:/Qt/6.7.2
          aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -O C:/Qt/6.7.2

      - name: Install OpenGL
        run: |
          choco install opengl32 -y

      - name: Build
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DQt6_DIR=C:/Qt/6.7.2/6.7.2/msvc2019_64/lib/cmake/Qt6
          cmake --build build --parallel --config Release

      - name: Package
        shell: pwsh
        run: |
          $env:Path = "C:/Qt/6.7.2/6.7.2/msvc2019_64/bin;$env:Path"
          mkdir -p release/bin
          cmake --install build --config Release --prefix release
          Get-ChildItem -Path release -Filter "*.exe" -Recurse | ForEach-Object {
            windeployqt $_.FullName --qmldir C:/Qt/6.7.2/6.7.2/msvc2019_64/qml --no-translations --no-compiler
          }
          Compress-Archive -Path release/bin -DestinationPath svnfilebox-win64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-win64
          path: svnfilebox-win64.zip
          retention-days: 5

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Draft Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: v1.0.1-qt
          name: SVNFileBox-Qt v1.0.1
          body: |
            ## SVNFileBox-Qt

            Cross-platform SVN client built with Qt 6.

            ### Downloads
            - Linux: `svnfilebox-linux.tar.gz`
            - macOS: `svnfilebox-macos.tar.gz`
            - Windows: `svnfilebox-win64.zip`
          files: |
            artifacts/svnfilebox-linux/svnfilebox-linux.tar.gz
            artifacts/svnfilebox-macos/svnfilebox-macos.tar.gz
            artifacts/svnfilebox-win64/svnfilebox-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}