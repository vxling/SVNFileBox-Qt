name: Qt Cross-Compile

on:
  # Trigger on version tags (e.g. v1.0.0-qt). No push-to-main triggers,
  # because we push frequently during development and Action minutes are
  # limited. To run a build, just push a tag:
  #   git tag v1.0.1-qt && git push --tags
  push:
    tags: ['v*-qt']
  # Allow manual trigger from the Actions UI for ad-hoc builds.
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.9.3 via aqtinstall
        run: |
          pip install aqtinstall>=3.2
          mkdir -p ~/Qt
          aqt install-qt linux desktop 6.9.3 linux_gcc_64 -O ~/Qt

      - name: Install system dependencies
        run: |
          sudo apt-get install -y libgl1-mesa-dev zlib1g-dev libapr1-dev libaprutil1-dev libzip-dev

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$HOME/Qt/6.9.3/gcc_64/lib/cmake
          cmake --build build --parallel

      - name: Package (Linux)
        run: |
          cmake --install build --prefix release
          # patchelf: 让可执行文件使用同目录下的 Qt 库（便携）
          EXE=$(find release -type f -executable -name 'SVNFileBox' | head -1)
          if command -v patchelf &> /dev/null; then
            # 复制 Qt 动态库到 bin 目录
            mkdir -p release/bin/Qt6/lib
            cp -n $HOME/Qt/6.9.3/gcc_64/lib/*.so* release/bin/ 2>/dev/null || true
            # 设置 rpath 让 Qt 库从 bin 目录加载
            patchelf --set-rpath '$ORIGIN/Qt6/lib' "$EXE" 2>/dev/null || true
            patchelf --add-needed libQt6*.so* "$EXE" 2>/dev/null || true
          fi
          tar -C release -czvf svnfilebox-linux.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-linux
          path: svnfilebox-linux.tar.gz
          retention-days: 5

  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.9.3
        run: |
          pip install aqtinstall>=3.2
          mkdir -p ~/Qt
          aqt install-qt mac desktop 6.9.3 clang_64 -O ~/Qt

      - name: Install dependencies
        run: brew install libzip apr apr-util

      - name: Symlink APR headers into SDK
        run: |
          # SDK's libsvn_client.h includes <apr.h> (top-level), not <apr-1/apr.h>.
          # Create direct symlinks at top-level so compiler finds them in SDK path.
          ln -sf /opt/homebrew/include/apr.h deps/svn-sdk/macos/include/apr.h
          ln -sf /opt/homebrew/include/aprutil.h deps/svn-sdk/macos/include/aprutil.h

      - name: Build
        env:
          CPPFLAGS: "-I/opt/homebrew/opt/apr/include -I/opt/homebrew/opt/apr-util/include"
          LDFLAGS: "-L/opt/homebrew/opt/apr/lib -L/opt/homebrew/opt/apr-util/lib"
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.9.3/macos/lib/cmake" \
            -DCMAKE_CXX_FLAGS="-I/opt/homebrew/opt/apr/include -I/opt/homebrew/opt/apr-util/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/opt/homebrew/opt/apr/lib -L/opt/homebrew/opt/apr-util/lib"
          cmake --build build --parallel

      - name: Package (macOS)
        run: |
          cmake --install build --prefix release
          # macdeployqt: 复制 Qt 运行时和 QML，修复 @rpath
          ~/Qt/6.9.3/macos/bin/macdeployqt release/bin/SVNFileBox.app
          # 打包 .app 目录
          tar -C release -czvf svnfilebox-macos.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-macos
          path: svnfilebox-macos.tar.gz
          retention-days: 5

  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.9.3
        run: |
          pip install aqtinstall>=3.2
          mkdir -p C:/Qt
          aqt install-qt windows desktop 6.9.3 win64_msvc2022_64 -O C:/Qt

      - name: Build
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DQt6_DIR=C:/Qt/6.9.3/msvc2022_64/lib/cmake/Qt6
          cmake --build build --parallel --config Release

      - name: Package
        shell: pwsh
        run: |
          $env:Path = "C:/Qt/6.9.3/msvc2022_64/bin;$env:Path"
          mkdir -p release/bin
          cmake --install build --config Release --prefix release
          Get-ChildItem -Path release -Filter "*.exe" -Recurse | ForEach-Object {
            windeployqt $_.FullName --qmldir C:/Qt/6.9.3/msvc2022_64/qml --no-translations
          }
          Compress-Archive -Path release/bin -DestinationPath svnfilebox-win64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-win64
          path: svnfilebox-win64.zip
          retention-days: 5

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Draft Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: v1.0.1-qt
          name: SVNFileBox-Qt v1.0.1
          body: |
            ## SVNFileBox-Qt

            Cross-platform SVN client built with Qt 6.

            ### Downloads
            - Linux: `svnfilebox-linux.tar.gz`
            - macOS: `svnfilebox-macos.tar.gz`
            - Windows: `svnfilebox-win64.zip`
          files: |
            artifacts/svnfilebox-linux/svnfilebox-linux.tar.gz
            artifacts/svnfilebox-macos/svnfilebox-macos.tar.gz
            artifacts/svnfilebox-win64/svnfilebox-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
