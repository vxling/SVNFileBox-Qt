name: Qt Cross-Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt via apt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev
          qmake --version || find /usr -name qmake 2>/dev/null

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix release
          tar -C release -czvf svnfilebox-linux.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-linux.tar.gz
          path: svnfilebox-linux.tar.gz
          retention-days: 5

  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: ${{ runner.os }}-qt6.5.3-${{ hashFiles('.github/workflows/cross-compile.yml') }}
          restore-keys: |
            ${{ runner.os }}-qt6.5.3-

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall==3.1
          mkdir -p ~/Qt
          aqt install-qt mac desktop 6.5.3 clang_64 -O ~/Qt

      - name: Build
        env:
          Qt6_DIR: /Users/runner/Qt/6.5.3/macos/lib/cmake/Qt6
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR=$Qt6_DIR
          cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix release
          tar -C release -czvf svnfilebox-macos.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-macos.tar.gz
          path: svnfilebox-macos.tar.gz
          retention-days: 5

  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: C:/Qt
          key: ${{ runner.os }}-qt6.5.3-${{ hashFiles('.github/workflows/cross-compile.yml') }}
          restore-keys: |
            ${{ runner.os }}-qt6.5.3-

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall==3.1
          aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 -O C:/Qt

      - name: Build
        shell: bash
        env:
          Qt6_DIR: C:/Qt/6.5.3/msvc2019_64/lib/cmake/Qt6
        run: |
          cmake -B build \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR=$Qt6_DIR
          cmake --build build --parallel --config Release

      - name: Package
        shell: pwsh
        env:
          Qt6_bin: C:/Qt/6.5.3/msvc2019_64/bin
        run: |
          $env:Path = "$env:Qt6_bin;$env:Path"
          mkdir -p release/bin
          cp build/Release/SVNFileBox.exe release/bin/
          windeployqt release/bin/SVNFileBox.exe --no-translations
          Compress-Archive -Path release/bin -DestinationPath svnfilebox-win64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-win64.zip
          path: svnfilebox-win64.zip
          retention-days: 5
