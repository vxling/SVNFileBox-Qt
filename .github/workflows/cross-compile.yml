name: Qt Cross-Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: svnfilebox-linux-x64.tar.gz
            cpack: TGZ
          - os: windows-2022
            artifact: svnfilebox-win64.zip
            cpack: ZIP
          - os: macos-14
            artifact: svnfilebox-macos.tar.gz
            cpack: TGZ

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Qt
        uses: qt-actions/setup-qt@v2
        with:
          version: "6.7.2"

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix release
          cd release
          cpack -G ${{ matrix.cpack }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.${{ matrix.cpack == 'ZIP' && 'zip' || 'tar.gz' }}
          retention-days: 5
