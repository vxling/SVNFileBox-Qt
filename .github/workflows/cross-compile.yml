name: Qt Cross-Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt via apt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-qmake

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix release
          cd release && cpack -G TGZ

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-linux-x64.tar.gz
          path: release/*.tar.gz
          retention-days: 5

  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        run: |
          pip install aqtinstall==3.1
          mkdir -p ~/Qt
          aqt install-qt mac desktop 6.5.7 clang_64 -O ~/Qt

      - name: Build
        env:
          Qt6_DIR: ~/Qt/6.5.7/clang_64/lib/cmake/Qt6
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR=$Qt6_DIR
          cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix release
          cd release && cpack -G TGZ

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-macos.tar.gz
          path: release/*.tar.gz
          retention-days: 5

  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        run: |
          pip install aqtinstall==3.1
          aqt install-qt windows desktop 6.5.7 win64_msvc2019_64 -O C:/Qt

      - name: Build
        env:
          Qt6_DIR: C:/Qt/6.5.7/msvc2019_64/lib/cmake/Qt6
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQt6_DIR=$env:Qt6_DIR
          cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix release
          cd release
          cpack -G ZIP

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnfilebox-win64.zip
          path: release/*.zip
          retention-days: 5
